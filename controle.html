<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCP - Gestão de Ordens de Produção</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, setDoc, query, where, onSnapshot, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9LqqUDiR2CdIrLduAv58RaDhVnHMVvDI",
            authDomain: "basededados-7ccdd.firebaseapp.com",
            projectId: "basededados-7ccdd",
            storageBucket: "basededados-7ccdd.firebasestorage.app",
            messagingSenderId: "811772325586",
            appId: "1:811772325586:web:09b658831a49b621fac70b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const opsCollection = collection(db, "ordens_producao");

        const baseProdutos = {
            "979 - ACUCAR REFINADO 10X1": { fator: 120, validadeAnos: 1, medida: "FD" },
            "671 - ACUCAR CRISTAL 10X1": { fator: 120, validadeAnos: 2, medida: "FD" },
            "9009 - ACUCAR EXTRAFINO  10X1": { fator: 120, validadeAnos: 1, medida: "FD" },
            "9000 - ACUCAR DEMERARA  10X1": { fator: 120, validadeAnos: 2, medida: "FD" },
            "669 - AÇUCAR CRISTAL 15X2": { fator: 40, validadeAnos: 2, medida: "FD" },
            "670 - ACUCAR CRISTAL 6X5": { fator: 40, validadeAnos: 2, medida: "FD" },
            "8489 - ACUCAR CRISTAL YPIRANGA 6X5": { fator: 40, validadeAnos: 2, medida: "FD" },
            "745 - AÇUCAR CRISTAL MEL DE ENG. 6X5": { fator: 40, validadeAnos: 2, medida: "FD" },
            "754 - ACUCAR REFINADO 6X5": { fator: 50, validadeAnos: 1, medida: "FD" },
            "1541 - AÇUCAR CRISTAL 25KG": { fator: 50, validadeAnos: 2, medida: "SC" },
            "7708 - ACUCAR EXTRAF. MEL DE ENG. 25 KG": { fator: 50, validadeAnos: 1, medida: "SC" },
            "7697 - ACUCAR CRISTAL MEL DE ENGE. 25KG": { fator: 50, validadeAnos: 2, medida: "SC" },
            "2517 - ACUCAR EXTRAFINO 25 KG": { fator: 50, validadeAnos: 1, medida: "SC" },
            "730 - ACUCAR VARREDURA SC 25 KG": { fator: 50, validadeAnos: 1, medida: "SC" },
            "8517 - ACUCAR DEMERARA 25 KG": { fator: 50, validadeAnos: 1, medida: "SC" },
        };

        const todasCores = [
            'bg-blue-500', 'bg-emerald-500', 'bg-rose-500', 'bg-amber-500', 
            'bg-purple-500', 'bg-orange-500', 'bg-pink-500', 'bg-indigo-500', 
            'bg-cyan-500', 'bg-teal-500', 'bg-lime-600'
        ];
        let coresEmUso = [];

        window.carregarProdutos = () => {
            const selectProduto = document.getElementById('produto');
            selectProduto.innerHTML = '<option value="" disabled selected>Selecione um Produto...</option>';
            for (let prod in baseProdutos) {
                selectProduto.innerHTML += `<option value="${prod}">${prod}</option>`;
            }
        };

        window.aoSelecionarProduto = () => {
            const produtoSelecionado = document.getElementById('produto').value;
            if (!produtoSelecionado) return;

            const dados = baseProdutos[produtoSelecionado];
            const hoje = new Date();

            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            document.getElementById('lote').value = `${mes}${dia}`;

            document.getElementById('qtdPorPalete').value = dados.fator;

            const dataValidade = new Date();
            dataValidade.setFullYear(dataValidade.getFullYear() + dados.validadeAnos);
            document.getElementById('dataValidade').value = dataValidade.toISOString().split('T')[0];
            
            document.getElementById('metaTurnoD').placeholder = `Qtd em ${dados.medida}`;
            document.getElementById('metaTurnoN').placeholder = `Qtd em ${dados.medida}`;
        };

        let enviandoOP = false;

        window.lancarOP = async (e) => {
            e.preventDefault(); 
            
            if (enviandoOP) return;
            enviandoOP = true;

            const btnSubmit = document.querySelector('button[type="submit"]');
            const originalText = btnSubmit.innerHTML;
            
            btnSubmit.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg> Lançando...`;
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-70', 'cursor-not-allowed');
            
            const produtoSelecionado = document.getElementById('produto').value;
            const produtoNome = produtoSelecionado.split(' - ')[1] || produtoSelecionado;
            const produtoCod = produtoSelecionado.split(' - ')[0] || "";
            const lote = document.getElementById('lote').value.toUpperCase();
            
            const metaTurnoD = parseInt(document.getElementById('metaTurnoD').value) || 0;
            const metaTurnoN = parseInt(document.getElementById('metaTurnoN').value) || 0;
            const metaTotal = metaTurnoD + metaTurnoN;
            
            const qtdPorPalete = parseInt(document.getElementById('qtdPorPalete').value);
            const dataProducao = document.getElementById('dataProducao').value;
            const dataValidade = document.getElementById('dataValidade').value;
            
            const medida = baseProdutos[produtoSelecionado] ? baseProdutos[produtoSelecionado].medida : 'UN';

            if (!produtoSelecionado || !lote || metaTotal <= 0 || !qtdPorPalete || !dataProducao || !dataValidade) {
                alert("Preencha todos os campos! A soma das metas deve ser maior que zero.");
                enviandoOP = false;
                btnSubmit.innerHTML = originalText;
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
                return;
            }

            const coresDisponiveis = todasCores.filter(cor => !coresEmUso.includes(cor));
            const corSorteada = coresDisponiveis.length > 0 
                ? coresDisponiveis[Math.floor(Math.random() * coresDisponiveis.length)]
                : todasCores[Math.floor(Math.random() * todasCores.length)];

            const [ano, mes, dia] = dataProducao.split('-');
            const dataBr = `${dia}-${mes}-${ano}`;
            const carimboTempo = new Date().getTime(); 
            const idCustomizado = `${dataBr} - ${produtoNome} - Lote ${lote} - ${carimboTempo}`;

            try {
                await setDoc(doc(db, "ordens_producao", idCustomizado), {
                    codigo: produtoCod,
                    produto: produtoNome,
                    lote: lote,
                    medida: medida,
                    metaTurnoD: metaTurnoD,
                    metaTurnoN: metaTurnoN,
                    metaTotal: metaTotal,
                    qtdPorPalete: qtdPorPalete,
                    dataProducao: dataProducao,
                    dataValidade: dataValidade,
                    corBotao: corSorteada, 
                    status: 'Aberta', 
                    paletesFeitos: 0,
                    fardosParciais: 0,
                    dataLancamento: serverTimestamp(),
                    metaExportadaParaExcel: false // Gatilho de sincronização inicial
                });
                
                document.getElementById('formOP').reset(); 
                document.getElementById('dataProducao').valueAsDate = new Date(); 
                document.getElementById('metaTurnoD').placeholder = "";
                document.getElementById('metaTurnoN').placeholder = "";

            } catch (error) {
                console.error("Erro ao lançar OP: ", error);
                alert("Erro ao lançar OP. Verifique o console.");
            } finally {
                setTimeout(() => {
                    enviandoOP = false;
                    if(btnSubmit) {
                        btnSubmit.innerHTML = originalText;
                        btnSubmit.disabled = false;
                        btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
                    }
                }, 1000);
            }
        };

        const q = query(opsCollection, where("status", "==", "Aberta"));
        onSnapshot(q, (snapshot) => {
            const tabela = document.getElementById('tabelaOPsAbertas');
            tabela.innerHTML = '';
            
            coresEmUso = [];

            if (snapshot.empty) {
                tabela.innerHTML = `
                    <tr>
                        <td colspan="8" class="p-8 text-center text-slate-500">
                            <svg class="mx-auto h-12 w-12 text-slate-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 022 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                            </svg>
                            <p class="text-base font-medium">Nenhuma OP ativa no momento.</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            snapshot.forEach((docSnap) => {
                const op = docSnap.data();
                const id = docSnap.id;
                
                if(op.corBotao) coresEmUso.push(op.corBotao);
                
                const totalProduzido = (op.paletesFeitos * op.qtdPorPalete) + op.fardosParciais;
                let progresso = op.metaTotal > 0 ? ((totalProduzido / op.metaTotal) * 100) : 0;
                if (progresso > 100) progresso = 100;

                tabela.innerHTML += `
                    <tr class="border-b border-slate-100 bg-white hover:bg-slate-50 transition-colors">
                        <td class="p-4 align-middle">
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 rounded-full ${op.corBotao || 'bg-slate-300'} shadow-sm"></div>
                                <span class="font-mono text-xs text-slate-500 font-medium">${op.codigo}</span>
                            </div>
                        </td>
                        <td class="p-4 align-middle font-semibold text-slate-800">${op.produto}</td>
                        <td class="p-4 align-middle font-mono text-sm text-indigo-600 bg-indigo-50/50 rounded inline-block mt-2 px-2 py-1">${op.lote}</td>
                        <td class="p-4 align-middle text-center">
                            <span class="font-bold text-slate-700">${op.metaTotal} <span class="text-xs text-slate-400 font-normal">${op.medida}</span></span><br>
                            <span class="text-xs font-bold text-blue-600 tracking-tight">D: ${op.metaTurnoD || 0}</span> 
                            <span class="text-xs text-slate-300 mx-1">|</span> 
                            <span class="text-xs font-bold text-purple-600 tracking-tight">N: ${op.metaTurnoN || 0}</span>
                        </td>
                        <td class="p-4 align-middle text-center text-sm font-medium text-slate-600">${op.qtdPorPalete}</td>
                        <td class="p-4 align-middle text-center font-bold text-emerald-600">${totalProduzido}</td>
                        <td class="p-4 align-middle">
                            <div class="flex items-center gap-3">
                                <div class="w-full bg-slate-100 rounded-full h-2">
                                    <div class="bg-indigo-500 h-2 rounded-full transition-all duration-500" style="width: ${progresso.toFixed(1)}%"></div>
                                </div>
                                <span class="text-xs font-bold text-slate-600 w-10 text-right">${progresso.toFixed(1)}%</span>
                            </div>
                        </td>
                        <td class="p-4 align-middle text-center">
                            <button onclick="excluirOP('${id}')" class="text-rose-500 hover:text-rose-700 hover:bg-rose-50 p-2 rounded-lg transition-colors tooltip relative group" title="Cancelar OP">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    </tr>
                `;
            });
        });

        const bloqueioExclusao = {};
        window.excluirOP = async (id) => {
            const agora = Date.now();
            if (bloqueioExclusao[id] && agora - bloqueioExclusao[id] < 1500) return; 
            bloqueioExclusao[id] = agora;

            if(confirm("Tem certeza que deseja cancelar esta OP? Ela será removida da tela do operador.")){
                try {
                    await deleteDoc(doc(db, "ordens_producao", id));
                } catch (error) {
                    console.error("Erro ao cancelar a OP:", error);
                }
            }
        };

        window.onload = () => {
            document.getElementById('dataProducao').valueAsDate = new Date();
            carregarProdutos();
        };

        document.getElementById('formOP').addEventListener('submit', window.lancarOP);
        document.getElementById('produto').addEventListener('change', window.aoSelecionarProduto);
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <nav class="bg-slate-900 text-white shadow-lg border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-500 p-2 rounded-lg">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <h1 class="text-xl font-bold tracking-tight">Painel PCP <span class="font-light text-indigo-300">| Gestão</span></h1>
                </div>
                <div>
                    <span class="text-xs font-medium bg-slate-800 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-full flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Sistema Online
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-8">
        
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
                <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    Lançar Nova Ordem de Produção
                </h2>
                <p class="text-sm text-slate-500 mt-1">Preencha os dados abaixo. A cor do cartão do operador será atribuída automaticamente.</p>
            </div>
            
            <div class="p-6">
                <form id="formOP" class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Produto</label>
                        <select id="produto" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow outline-none" required></select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Lote</label>
                        <input type="text" id="lote" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg uppercase focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-mono transition-shadow outline-none" placeholder="Ex: 0825" required>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Qtd por Palete (Fator)</label>
                        <input type="number" id="qtdPorPalete" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow outline-none" required>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-blue-700 mb-1.5">Meta Turno D</label>
                        <input type="number" id="metaTurnoD" class="w-full p-2.5 text-sm bg-blue-50/50 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow outline-none" required>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-purple-700 mb-1.5">Meta Turno N</label>
                        <input type="number" id="metaTurnoN" class="w-full p-2.5 text-sm bg-purple-50/50 border border-purple-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-shadow outline-none" required>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Data de Produção</label>
                        <input type="date" id="dataProducao" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow outline-none" required>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Data de Validade</label>
                        <input type="date" id="dataValidade" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow outline-none" required>
                    </div>

                    <div class="col-span-1 md:col-span-4 mt-2 border-t border-slate-100 pt-6">
                        <button type="submit" class="w-full md:w-auto md:float-right bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-3 px-8 rounded-lg shadow-sm shadow-indigo-200 transition-all focus:ring-4 focus:ring-indigo-100 flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            Confirmar Lançamento
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-slate-800">Operações Ativas no Chão de Fábrica</h2>
                <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full border border-emerald-200">Tempo Real</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[800px]">
                    <thead>
                        <tr class="bg-white text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="p-4 font-semibold">Cód</th>
                            <th class="p-4 font-semibold">Produto</th>
                            <th class="p-4 font-semibold">Lote</th>
                            <th class="p-4 font-semibold text-center">Meta Total (D/N)</th>
                            <th class="p-4 font-semibold text-center">Fator/Plt</th>
                            <th class="p-4 font-semibold text-center">Produzido</th>
                            <th class="p-4 font-semibold w-40">Progresso</th>
                            <th class="p-4 font-semibold text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaOPsAbertas" class="divide-y divide-slate-100">
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
