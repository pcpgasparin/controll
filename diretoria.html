<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Executivo - Produção em Tempo Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .live-indicator {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // As mesmas credenciais para conectar ao mesmo banco de dados
        const firebaseConfig = {
            apiKey: "AIzaSyC9LqqUDiR2CdIrLduAv58RaDhVnHMVvDI",
            authDomain: "basededados-7ccdd.firebaseapp.com",
            projectId: "basededados-7ccdd",
            storageBucket: "basededados-7ccdd.firebasestorage.app",
            messagingSenderId: "811772325586",
            appId: "1:811772325586:web:09b658831a49b621fac70b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const opsCollection = collection(db, "ordens_producao");

        // Escuta as OPs abertas em tempo real
        const q = query(opsCollection, where("status", "==", "Aberta"));
        
        onSnapshot(q, (snapshot) => {
            const grid = document.getElementById('gridDashboard');
            grid.innerHTML = '';
            
            // Se não houver OP aberta, mostra mensagem
            if (snapshot.empty) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center h-64 text-slate-400 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <svg class="w-20 h-20 mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                        <h2 class="text-2xl font-bold text-slate-500">Nenhuma Produção Ativa</h2>
                        <p class="text-lg mt-2">Aguardando o PCP lançar novas Ordens de Produção.</p>
                    </div>
                `;
                return;
            }

            // Para cada OP aberta, cria um "Card" grande de acompanhamento
            snapshot.forEach((docSnap) => {
                const op = docSnap.data();
                
                // Cálculos em tempo real
                const totalProduzido = (op.paletesFeitos * op.qtdPorPalete) + op.fardosParciais;
                let progresso = ((totalProduzido / op.metaTotal) * 100);
                if (progresso > 100) progresso = 100;
                
                // Formatação da cor recebida do PCP (ex: bg-blue-500 vira cor sólida do tailwind)
                const corFaixa = op.corBotao || 'bg-slate-500';
                const corTexto = op.corBotao ? op.corBotao.replace('bg-', 'text-') : 'text-slate-500';

                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden flex flex-col h-full transform transition duration-300 hover:shadow-lg">
                        <!-- Faixa superior colorida -->
                        <div class="h-3 w-full ${corFaixa}"></div>
                        
                        <div class="p-6 flex-1 flex flex-col">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <span class="inline-block px-2.5 py-1 bg-slate-100 text-slate-600 text-xs font-bold rounded-lg mb-2 font-mono border border-slate-200">
                                        LOTE: ${op.lote}
                                    </span>
                                    <h3 class="text-2xl font-black text-slate-800 leading-tight mb-1">${op.produto}</h3>
                                    <p class="text-sm font-medium text-slate-500">Cód: ${op.codigo}</p>
                                </div>
                            </div>

                            <div class="mt-4 mb-6">
                                <div class="flex justify-between items-end mb-2">
                                    <div class="text-slate-500 font-semibold text-sm uppercase tracking-wider">Produzido Agora</div>
                                    <div class="text-right">
                                        <span class="text-4xl font-black ${corTexto} leading-none">${totalProduzido.toLocaleString('pt-BR')}</span>
                                        <span class="text-lg font-bold text-slate-400 ml-1">${op.medida}</span>
                                    </div>
                                </div>
                                
                                <!-- Barra de Progresso -->
                                <div class="w-full bg-slate-100 rounded-full h-4 mb-2 shadow-inner overflow-hidden">
                                    <div class="${corFaixa} h-4 rounded-full transition-all duration-1000 ease-out relative" style="width: ${progresso}%">
                                        <div class="absolute inset-0 bg-white/20"></div>
                                    </div>
                                </div>
                                
                                <div class="flex justify-between items-center text-sm font-semibold">
                                    <span class="text-slate-500">${progresso.toFixed(1)}% Concluído</span>
                                    <span class="text-slate-700">Meta: ${op.metaTotal.toLocaleString('pt-BR')} ${op.medida}</span>
                                </div>
                            </div>

                            <div class="mt-auto pt-4 border-t border-slate-100 flex gap-4">
                                <div class="flex-1 bg-slate-50 rounded-xl p-3 border border-slate-100 text-center">
                                    <div class="text-xs text-slate-500 font-bold uppercase mb-1">Paletes Feitos</div>
                                    <div class="text-2xl font-black text-slate-700">${op.paletesFeitos}</div>
                                </div>
                                <div class="flex-1 bg-slate-50 rounded-xl p-3 border border-slate-100 text-center">
                                    <div class="text-xs text-slate-500 font-bold uppercase mb-1">Avulsos (${op.medida})</div>
                                    <div class="text-2xl font-black text-slate-700">${op.fardosParciais}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        });

        // Atualiza relógio
        setInterval(() => {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
            document.getElementById('dataAtual').innerText = agora.toLocaleDateString('pt-BR');
        }, 1000);
    </script>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header Executivo -->
    <header class="bg-slate-900 text-white py-4 px-6 shadow-xl sticky top-0 z-50">
        <div class="max-w-[1600px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow-lg">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight">Painel Executivo de Produção</h1>
                    <p class="text-slate-400 text-sm font-medium flex items-center gap-2 mt-0.5">
                        <span class="w-2.5 h-2.5 bg-red-500 rounded-full live-indicator inline-block"></span>
                        Atualização em Tempo Real
                    </p>
                </div>
            </div>

            <div class="bg-slate-800 rounded-xl px-5 py-2 border border-slate-700 flex flex-col items-end">
                <span id="relogio" class="text-2xl font-black tracking-widest text-white font-mono">--:--:--</span>
                <span id="dataAtual" class="text-xs font-bold text-slate-400 uppercase tracking-widest">--/--/----</span>
            </div>

        </div>
    </header>

    <!-- Área Principal de Dashboard -->
    <main class="flex-1 p-6 md:p-8 max-w-[1600px] w-full mx-auto">
        <div id="gridDashboard" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6 auto-rows-fr">
            <!-- Cards gerados pelo Firebase via JavaScript aparecerão aqui -->
        </div>
    </main>

</body>
</html>
