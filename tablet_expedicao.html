<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tablet - Expedição</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { user-select: none; -webkit-user-select: none; }
        .btn-press { transition: transform 0.1s; }
        .btn-press:active { transform: scale(0.95); }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Sua Chave do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyC9LqqUDiR2CdIrLduAv58RaDhVnHMVvDI",
            authDomain: "basededados-7ccdd.firebaseapp.com",
            projectId: "basededados-7ccdd",
            storageBucket: "basededados-7ccdd.firebasestorage.app",
            messagingSenderId: "811772325586",
            appId: "1:811772325586:web:09b658831a49b621fac70b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const cargasCollection = collection(db, "cargas_expedicao");

        // Confirma a Saída Física
        window.despacharCarga = async (idCarga, numeroCarga) => {
            if (confirm(`CONFERÊNCIA: Tem certeza que a Carga ${numeroCarga} está 100% carregada no caminhão e pronta para sair?`)) {
                try {
                    await updateDoc(doc(db, "cargas_expedicao", idCarga), {
                        status: 'Despachada',
                        dataDespacho: serverTimestamp()
                    });
                } catch (error) {
                    console.error("Erro ao despachar:", error);
                    alert("Erro de conexão. Tente novamente.");
                }
            }
        };

        // Devolve pro PCP
        window.devolverCargaPCP = async (idCarga, numeroCarga) => {
            if (confirm(`O caminhão da carga ${numeroCarga} NÃO VAI CARREGAR HOJE? Esta ação devolve a carga para o PCP.`)) {
                try {
                    await updateDoc(doc(db, "cargas_expedicao", idCarga), {
                        status: 'Retida',
                        dataRetencao: serverTimestamp()
                    });
                } catch (error) {
                    console.error("Erro ao reter:", error);
                    alert("Erro de conexão. Tente novamente.");
                }
            }
        };

        const q = query(cargasCollection, where("status", "==", "Aguardando Despacho"));
        onSnapshot(q, (snapshot) => {
            const painel = document.getElementById('painelExpedicao');
            painel.innerHTML = '';
            
            if (snapshot.empty) {
                painel.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center h-[70vh] text-gray-400">
                        <svg class="w-32 h-32 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                        <h2 class="text-4xl font-bold">Nenhuma Carga Liberada</h2>
                        <p class="text-2xl mt-2">Aguardando o PCP montar novas cargas...</p>
                    </div>
                `;
                return;
            }

            snapshot.forEach((docSnap) => {
                const carga = docSnap.data();
                const id = docSnap.id;
                
                let itensHTML = '';
                carga.itens.forEach(item => {
                    itensHTML += `
                        <div class="bg-gray-100 p-4 rounded-lg mb-3 border-l-8 border-blue-500 shadow-sm">
                            <p class="font-black text-xl text-gray-800 leading-tight">${item.produto}</p>
                            <div class="flex justify-between items-center mt-3 border-t border-gray-200 pt-3">
                                <span class="text-2xl font-black text-blue-700">${item.quantidade} <span class="text-lg text-gray-500">${item.medida}</span></span>
                                <span class="bg-red-100 text-red-700 font-mono font-black px-4 py-1 rounded text-xl border-2 border-red-300">LOTE: ${item.lote}</span>
                            </div>
                        </div>
                    `;
                });

                painel.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-2xl border-4 border-orange-400 p-5 flex flex-col h-full">
                        <div class="text-center mb-6 bg-orange-100 py-3 rounded-lg border-b-4 border-orange-200">
                            <p class="text-orange-800 font-bold tracking-widest uppercase text-sm">Carga Oficial</p>
                            <h2 class="text-5xl font-black text-orange-600">${carga.numeroCarga}</h2>
                        </div>
                        
                        <div class="flex-1 overflow-y-auto pr-2 mb-4">
                            <p class="text-gray-500 font-bold mb-2 uppercase text-sm">Itens para Conferência:</p>
                            ${itensHTML}
                        </div>

                        <div class="mt-auto space-y-3">
                            <button 
                                onclick="despacharCarga('${id}', '${carga.numeroCarga}')" 
                                class="w-full bg-green-600 hover:bg-green-700 text-white font-black text-3xl py-6 rounded-xl shadow-lg btn-press flex items-center justify-center gap-3 uppercase">
                                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                Despachar Caminhão
                            </button>
                            
                            <button 
                                onclick="devolverCargaPCP('${id}', '${carga.numeroCarga}')" 
                                class="w-full bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-bold text-xl py-3 rounded-lg border-2 border-yellow-300 shadow-sm btn-press uppercase">
                                Caminhão Não Veio (Devolver)
                            </button>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</head>
<body class="bg-slate-200 font-sans min-h-screen flex flex-col">

    <header class="bg-gray-900 text-white p-4 shadow-lg flex justify-between items-center border-b-4 border-green-500">
        <div class="flex items-center gap-3">
            <svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
            <h1 class="text-3xl font-black tracking-widest uppercase">DOCA - EXPEDIÇÃO</h1>
        </div>
        <div id="relogio" class="text-2xl font-mono font-black text-green-400 bg-gray-800 px-4 py-2 rounded-lg border border-gray-700 shadow-inner">
            --:--:--
        </div>
    </header>

    <main class="flex-1 p-6">
        <div id="painelExpedicao" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8 h-full auto-rows-[600px]">
        </div>
    </main>

    <script>
        setInterval(() => {
            document.getElementById('relogio').innerText = new Date().toLocaleTimeString('pt-BR');
        }, 1000);
    </script>
</body>
</html>
