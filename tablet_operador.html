<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel do Operador - Produção</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { user-select: none; -webkit-user-select: none; }
        .btn-press { transition: transform 0.1s, opacity 0.1s; }
        .btn-press:active { transform: scale(0.95); opacity: 0.8; }
        /* Esconde o ícone de calendário padrão em alguns navegadores para ficar mais limpo */
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, increment, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9LqqUDiR2CdIrLduAv58RaDhVnHMVvDI",
            authDomain: "basededados-7ccdd.firebaseapp.com",
            projectId: "basededados-7ccdd",
            storageBucket: "basededados-7ccdd.firebasestorage.app",
            messagingSenderId: "811772325586",
            appId: "1:811772325586:web:09b658831a49b621fac70b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const opsCollection = collection(db, "ordens_producao");
        const histCollection = collection(db, "historico_producao");

        // Função que pega o turno manual ou calcula pela hora
        function calcularTurnoAtual() {
            const seletorTurno = document.getElementById('seletorTurnoManual').value;
            
            if (seletorTurno !== "AUTO") {
                return seletorTurno;
            }

            const agora = new Date();
            const horas = agora.getHours();
            const minutos = agora.getMinutes();
            const tempoEmMinutos = (horas * 60) + minutos;
            
            if (tempoEmMinutos >= 420 && tempoEmMinutos <= 1070) {
                return "D";
            } else {
                return "N";
            }
        }

        // NOVA FUNÇÃO: Pega a data forçada ou usa a data/hora do servidor
        function obterDataRegistro() {
            const dataManual = document.getElementById('seletorDataManual').value;
            if (dataManual) {
                // Cria a data no meio-dia para garantir que o fuso horário não mude o dia
                const [ano, mes, dia] = dataManual.split('-');
                return new Date(ano, mes - 1, dia, 12, 0, 0); 
            }
            return serverTimestamp(); // Automático
        }

        window.registrarPalete = async (id, btnElement, produto, lote, qtdPorPalete, medida) => {
            btnElement.classList.add('scale-95', 'opacity-75');
            setTimeout(() => btnElement.classList.remove('scale-95', 'opacity-75'), 150);

            const turnoNoMomentoDoClique = calcularTurnoAtual();
            const dataAcao = obterDataRegistro();

            try {
                const opRef = doc(db, "ordens_producao", id);
                await updateDoc(opRef, { 
                    paletesFeitos: increment(1),
                    dataRegistro: dataAcao
                });

                await addDoc(histCollection, {
                    idOP: id,
                    produto: produto,
                    lote: lote,
                    quantidade: qtdPorPalete,
                    medida: medida,
                    tipo: "Palete Cheio",
                    turno: turnoNoMomentoDoClique, 
                    dataRegistro: dataAcao,
                    exportadoParaExcel: false
                });
            } catch (error) {
                console.error("Erro ao registrar palete:", error);
                alert("Erro de conexão. Tente novamente.");
            }
        };

        window.registrarParcial = async (id, medida, produto, lote) => {
            let qtdStr = prompt(`Digite a quantidade de ${medida} avulsos (Palete Incompleto):`);
            if (qtdStr === null || qtdStr.trim() === "") return; 
            
            let qtd = parseInt(qtdStr);
            if (isNaN(qtd) || qtd <= 0) {
                alert("Quantidade inválida! Digite apenas números maiores que zero.");
                return;
            }

            const turnoNoMomentoDoClique = calcularTurnoAtual();
            const dataAcao = obterDataRegistro();

            try {
                const opRef = doc(db, "ordens_producao", id);
                await updateDoc(opRef, { 
                    fardosParciais: increment(qtd),
                    dataRegistro: dataAcao
                });

                await addDoc(histCollection, {
                    idOP: id,
                    produto: produto,
                    lote: lote,
                    quantidade: qtd,
                    medida: medida,
                    tipo: "Avulso/Parcial",
                    turno: turnoNoMomentoDoClique, 
                    dataRegistro: dataAcao,
                    exportadoParaExcel: false
                });
            } catch (error) {
                console.error("Erro ao registrar parcial:", error);
                alert("Erro de conexão. Tente novamente.");
            }
        };

        window.alterarQtdPalete = async (id, qtdAtual, medida, paletesFeitos, fardosParciais) => {
            let novaQtdStr = prompt(`Quantidade atual: ${qtdAtual} ${medida} por palete.\nDigite a NOVA quantidade padrão para este palete:`, qtdAtual);
            if (novaQtdStr === null || novaQtdStr.trim() === "") return;
            
            let novaQtd = parseInt(novaQtdStr);
            if (isNaN(novaQtd) || novaQtd <= 0) {
                alert("Quantidade inválida! Digite um número maior que zero.");
                return;
            }

            if (novaQtd === qtdAtual) return;

            if (confirm(`Atenção: Os próximos cliques vão valer ${novaQtd} ${medida}.\nConfirmar alteração?`)) {
                try {
                    const dataAcao = obterDataRegistro();
                    const totalConsolidadoAteAgora = (paletesFeitos * qtdAtual) + fardosParciais;
                    const opRef = doc(db, "ordens_producao", id);
                    await updateDoc(opRef, { 
                        qtdPorPalete: novaQtd,
                        paletesFeitos: 0, 
                        fardosParciais: totalConsolidadoAteAgora, 
                        dataRegistro: dataAcao
                    });
                } catch (error) {
                    console.error("Erro ao alterar qtd do palete:", error);
                    alert("Erro de conexão. Tente novamente.");
                }
            }
        };

        window.finalizarOP = async (id, produto) => {
            if (confirm(`Atenção: A produção de ${produto} foi totalmente concluída? Ela irá sumir da tela.`)) {
                try {
                    const dataAcao = obterDataRegistro();
                    const opRef = doc(db, "ordens_producao", id);
                    await updateDoc(opRef, { 
                        status: 'Finalizada',
                        dataRegistro: dataAcao
                    });
                } catch (error) {
                    console.error("Erro ao finalizar OP:", error);
                    alert("Erro de conexão. Tente novamente.");
                }
            }
        };

        const q = query(opsCollection, where("status", "==", "Aberta"));
        onSnapshot(q, (snapshot) => {
            const painel = document.getElementById('painelOperador');
            painel.innerHTML = ''; 
            
            if (snapshot.empty) {
                painel.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center h-64 text-gray-400">
                        <svg class="w-20 h-20 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <h2 class="text-3xl font-bold">Nenhuma Ordem de Produção Aberta</h2>
                        <p class="text-xl mt-2">Aguardando liberação do PCP...</p>
                    </div>
                `;
                return;
            }

            snapshot.forEach((docSnap) => {
                const op = docSnap.data();
                const id = docSnap.id;
                
                const totalProduzido = (op.paletesFeitos * op.qtdPorPalete) + op.fardosParciais;
                
                painel.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-xl border-4 border-gray-200 p-4 flex flex-col h-full">
                        <div class="text-center mb-4">
                            <h2 class="text-3xl font-black text-gray-800 leading-tight">${op.produto}</h2>
                            <div class="flex justify-center gap-4 mt-2">
                                <span class="bg-blue-100 text-blue-800 px-4 py-1 rounded-full text-xl font-bold font-mono border border-blue-300">LOTE: ${op.lote}</span>
                                <span class="bg-gray-100 text-gray-700 px-4 py-1 rounded-full text-lg font-semibold border border-gray-300">META: ${op.metaTotal} ${op.medida}</span>
                            </div>
                        </div>

                        <button 
                            onclick="registrarPalete('${id}', this, '${op.produto}', '${op.lote}', ${op.qtdPorPalete}, '${op.medida}')" 
                            class="flex-1 w-full ${op.corBotao} text-white rounded-xl shadow-lg flex flex-col items-center justify-center p-6 btn-press min-h-[250px] mb-4">
                            <span class="text-6xl font-black mb-2">+1</span>
                            <span class="text-3xl font-bold tracking-wide">PALETE</span>
                            <span class="text-xl font-medium mt-2 bg-black bg-opacity-20 px-4 py-1 rounded-full">Contém ${op.qtdPorPalete} ${op.medida}</span>
                        </button>

                        <div class="bg-gray-100 rounded-lg p-3 text-center mb-4 border border-gray-200">
                            <p class="text-lg text-gray-600 font-semibold uppercase">Total Produzido Agora</p>
                            <p class="text-4xl font-black text-green-600">${totalProduzido} <span class="text-2xl text-gray-500">${op.medida}</span></p>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mt-auto">
                            <button onclick="registrarParcial('${id}', '${op.medida}', '${op.produto}', '${op.lote}')" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold text-sm py-3 px-2 rounded-lg shadow btn-press flex flex-col items-center justify-center gap-1">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                Palete Incompleto
                            </button>
                            
                            <button onclick="alterarQtdPalete('${id}', ${op.qtdPorPalete}, '${op.medida}', ${op.paletesFeitos}, ${op.fardosParciais})" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold text-sm py-3 px-2 rounded-lg shadow border border-blue-300 btn-press flex flex-col items-center justify-center gap-1">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                Alterar Qtd/Palete
                            </button>

                            <button onclick="finalizarOP('${id}', '${op.produto}')" class="col-span-2 bg-gray-800 hover:bg-black text-white font-bold text-lg py-3 px-2 rounded-lg shadow btn-press flex items-center justify-center gap-2">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                Finalizar OP
                            </button>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</head>
<body class="bg-slate-200 font-sans min-h-screen flex flex-col">

    <header class="bg-gray-900 text-white p-4 shadow-lg flex justify-between items-center flex-wrap gap-4">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <h1 class="text-3xl font-black tracking-wider">APONTAMENTO DE PRODUÇÃO</h1>
        </div>
        
        <div class="flex items-center gap-4 flex-wrap">
            
            <div class="flex items-center bg-gray-800 rounded-lg p-1 border border-gray-700" title="Deixe vazio para usar a data de hoje">
                <label for="seletorDataManual" class="text-sm font-bold text-gray-300 px-3 uppercase">Data:</label>
                <input type="date" id="seletorDataManual" class="bg-gray-700 text-white text-lg font-bold p-1 rounded focus:outline-none focus:ring-2 focus:ring-green-400">
                <button onclick="document.getElementById('seletorDataManual').value = ''" class="ml-2 px-2 py-1 text-xs font-bold bg-gray-600 hover:bg-red-500 text-white rounded transition" title="Limpar Data">X</button>
            </div>

            <div class="flex items-center bg-gray-800 rounded-lg p-1 border border-gray-700">
                <label for="seletorTurnoManual" class="text-sm font-bold text-gray-300 px-3 uppercase">Turno:</label>
                <select id="seletorTurnoManual" class="bg-gray-700 text-white text-lg font-bold p-1 rounded focus:outline-none focus:ring-2 focus:ring-green-400">
                    <option value="AUTO">Automático (Pela Hora)</option>
                    <option value="D">Turno D (Forçar)</option>
                    <option value="N">Turno N (Forçar)</option>
                </select>
            </div>
            
            <div id="relogio" class="text-2xl font-mono font-bold bg-gray-800 px-4 py-2 rounded-lg border border-gray-700">--:--:--</div>
        </div>
    </header>

    <main class="flex-1 p-6">
        <div id="painelOperador" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 h-full auto-rows-fr"></div>
    </main>

    <script>
        setInterval(() => {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
        }, 1000);
    </script>
</body>
</html>
